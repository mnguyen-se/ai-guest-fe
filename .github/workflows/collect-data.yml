name: Thu thập dữ liệu đầu tư hằng ngày

on:
  schedule:
    # Chạy 2 lần/ngày (giờ UTC): 06:30 và 13:30 UTC ~ 13:30 và 20:30 giờ VN
    - cron: "30 6 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch: {}   # cho phép bấm "Run workflow" thủ công trên GitHub

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Cài dependencies
        run: pip install -r requirements.txt

      - name: Chạy thu thập dữ liệu
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python collect_daily.py
